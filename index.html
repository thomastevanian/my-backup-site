<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Backup Access Hub</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 32px;
            max-width: 480px;
            width: 90%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }
        .status-badge {
            display: inline-block;
            background-color: #238636;
            color: white;
            font-size: 12px;
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 16px;
        }
        h1 { margin: 0 0 8px 0; color: #f0f6fc; font-size: 24px; }
        p { color: #8b949e; font-size: 14px; margin-bottom: 24px; }
        .btn-list { display: flex; flex-direction: column; gap: 12px; }
        .btn {
            background-color: #21262d;
            color: #58a6ff;
            border: 1px solid #30363d;
            padding: 12px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .btn:hover {
            background-color: #30363d;
            border-color: #8b949e;
        }
    </style>
</head>
<body>

    <div class="card">
        <span class="status-badge">● Systems Operational</span>
        <h1>Official Backup Portal</h1>
        <p>If the main service is unreachable, select an active mirror below to access your session.</p>

        <div class="btn-list">
            <a href="https://thomastevanian.github.io/my-backup-site/" class="btn" target="_blank">Mirror 1 (GitHub Cloud)</a>
            <a href="https://my-backup-site.thomas-tevanian.workers.dev" class="btn" target="_blank">Mirror 2 (Cloudflare Edge)</a>
        </div>
    </div>

</body>
</html>
